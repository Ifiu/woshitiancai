<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>基地刚醒牛逼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  :root {
    --ink: #33253f;
    --ink-soft: #7a6390;
    --paper: #fff7e6;
    --paper-2: #fffdf6;
    --page-bg: #70d6c5;
    --primary: #ff5d8f;
    --primary-deep: #d63a6d;
    --accent: #ffb020;
    --danger: #e5484d;
    --danger-deep: #b93136;
    --bubble-user: #ffe066;
    --pov-stage-bg: #70d6c5;
    --pov-chat-bg: #8ee4d5;
    --pov-accent: #ff5d8f;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--page-bg); color: var(--ink);
    background-image: radial-gradient(rgba(255,255,255,.4) 2px, transparent 2.5px);
    background-size: 24px 24px;
    display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--paper); box-shadow: 0 0 0 4px var(--ink), 12px 12px 0 rgba(51,37,63,.3); }

  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--paper); border-bottom: 3px solid var(--ink); flex: none;
  }
  #worldBtn {
    flex: 1; min-width: 0; text-align: left; font-size: 15px; font-weight: 800;
    border: none; background: none; color: var(--ink); padding: 6px 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  header .tool {
    flex: none; border: 3px solid var(--ink); background: var(--accent); color: var(--ink);
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
  }
  button { position: relative; overflow: hidden; transition: transform .1s, box-shadow .1s; }
  button:active { transform: translateY(2px); }
  header .tool:active, .btn:active { box-shadow: 0 1px 0 var(--ink); }
  .btn.primary:active, #sendBtn:active { box-shadow: 0 1px 0 var(--primary-deep); }
  #stopBtn:active { box-shadow: 0 1px 0 var(--danger-deep); }

  #sceneBar {
    display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    background: var(--paper); border-bottom: 3px solid var(--ink); overflow-x: auto; flex: none;
  }
  .chip {
    display: flex; align-items: center; gap: 6px; border: 3px solid var(--ink);
    border-radius: 999px; padding: 3px 12px 3px 3px; font-size: 12px; font-weight: 700; cursor: pointer;
    background: var(--paper-2); color: var(--ink); flex: none; box-shadow: 0 3px 0 var(--ink);
    position: relative; overflow: hidden;
    transition: opacity .15s, transform .1s, box-shadow .1s;
  }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .chip.off { opacity: .45; }
  .chip .st { font-size: 10px; color: var(--ink-soft); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; overflow: hidden; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 800; position: relative;
    border: 2px solid var(--ink);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .avatar.lg { width: 44px; height: 44px; font-size: 19px; border-width: 3px; }

  #stage {
    flex: none; height: 150px; display: flex; align-items: flex-end; gap: 14px;
    padding: 10px 16px 0; overflow-x: auto; overflow-y: hidden;
    background-color: var(--pov-stage-bg);
    background-image: repeating-conic-gradient(rgba(255,255,255,.28) 0% 25%, rgba(255,255,255,0) 0% 50%);
    background-size: 18px 18px;
    border-bottom: 3px solid var(--ink);
    transition: background-color .5s;
  }
  #stage[hidden] { display: none; }
  .standee {
    position: relative; flex: none; width: 84px; height: 124px;
    border: 3px solid var(--ink); border-radius: 14px 14px 0 0;
    box-shadow: 4px 0 0 rgba(51,37,63,.35);
    display: flex; align-items: flex-end; justify-content: center;
    transition: transform .3s, box-shadow .3s;
  }
  .standee::before {
    content: ""; position: absolute; top: 5px; left: 5px; width: 6px; height: 6px;
    background: rgba(255,255,255,.9);
    box-shadow: 9px 0 0 rgba(255,255,255,.45), 0 9px 0 rgba(255,255,255,.45);
  }
  .standee img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 11px 11px 0 0; }
  .standee .nm {
    position: relative; z-index: 1; max-width: calc(100% - 8px); margin-bottom: 6px;
    background: var(--ink); color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .standee.focus { transform: translateY(-6px) scale(1.07); z-index: 2; box-shadow: 4px 0 0 rgba(51,37,63,.35), 0 0 0 3px var(--pov-accent); }
  @keyframes standeeIn { from { transform: translateY(30px) scale(.7); opacity: 0; } }
  .standee.entering { animation: standeeIn .28s ease-out; }
  @keyframes standeeOut { to { transform: translateY(30px) scale(.7); opacity: 0; } }
  .standee.leaving { animation: standeeOut .25s ease-in forwards; }

  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px;
    background-color: var(--pov-chat-bg);
    background-image: radial-gradient(rgba(255,255,255,.55) 2px, transparent 2.5px);
    background-size: 20px 20px;
    transition: background-color .5s;
  }
  #emptyHint {
    margin: auto; color: var(--ink); font-size: 13px; text-align: center; line-height: 2;
    padding: 16px 20px; background: var(--paper-2); border: 3px dashed var(--ink); border-radius: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 92%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: stretch; max-width: 100%; }
  .bubble {
    padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.75;
    word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
    border: 3px solid var(--ink);
  }
  .msg.user .bubble { background: var(--bubble-user); color: var(--ink); border-bottom-right-radius: 4px; box-shadow: 3px 3px 0 rgba(51,37,63,.85); }
  .msg.assistant .bubble { background: var(--paper-2); border-top-left-radius: 4px; box-shadow: -3px 3px 0 rgba(51,37,63,.85); }
  .meta { font-size: 11px; color: var(--ink-soft); margin: 0 4px 4px; display: flex; gap: 8px; align-items: center; font-weight: 700; }
  .msg.user .meta { justify-content: flex-end; margin: 0 4px 4px 0; }
  .msg-actions { display: flex; gap: 10px; margin-top: 4px; padding: 0 4px; }
  .msg-actions button { border: none; background: none; color: var(--ink-soft); font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px; }
  .streaming .bubble::after { content: "\258D"; color: var(--primary); animation: blink .8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #inputBar {
    flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--paper); border-top: 3px solid var(--ink);
  }
  #povSel {
    flex: none; max-width: 108px; border: 3px solid var(--ink); border-radius: 10px;
    padding: 8px 6px; font-size: 12px; font-weight: 700; color: var(--ink); background: var(--paper-2);
    cursor: pointer; outline: none;
  }
  #promptInput {
    flex: 1; resize: none; border: 3px solid var(--ink); border-radius: 12px;
    padding: 9px 12px; font-size: 14px; line-height: 1.5; max-height: 120px;
    font-family: inherit; background: var(--paper-2); outline: none;
  }
  #promptInput:focus, #povSel:focus, .form input:focus, .form textarea:focus, .form select:focus {
    border-color: var(--primary);
    animation: focusPulse 1.4s ease-in-out infinite;
  }
  @keyframes focusPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,93,143,.35); }
    50% { box-shadow: 0 0 0 5px rgba(255,93,143,.16); }
  }
  #sendBtn, #stopBtn {
    flex: none; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 16px;
    font-size: 14px; font-weight: 800; cursor: pointer; color: #fff; background: var(--primary);
    box-shadow: 0 4px 0 var(--primary-deep);
  }
  #stopBtn { background: var(--danger); box-shadow: 0 4px 0 var(--danger-deep); }

  .overlay {
    position: fixed; inset: 0; background: rgba(51,37,63,.55);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay[hidden] { display: none; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 480px; max-height: 82dvh;
    border: 3px solid var(--ink); border-bottom: none;
    border-radius: 20px 20px 0 0; padding: 16px; overflow-y: auto;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateY(40px); transition: transform .25s;
  }
  .overlay.open .sheet { transform: none; }
  .sheet h2 { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
  .sheet .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 2px dashed rgba(51,37,63,.25); }
  .sheet .row .grow { flex: 1; min-width: 0; position: relative; overflow: hidden; border-radius: 8px; }
  .sheet .row .name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .row .sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { border: 3px solid var(--ink); background: var(--paper-2); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .btn.primary { background: var(--primary); color: #fff; box-shadow: 0 3px 0 var(--primary-deep); }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; margin-top: 12px; padding: 10px; }
  .form label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 12px 0 4px; }
  .form input, .form textarea, .form select {
    width: 100%; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px;
    font-size: 14px; font-family: inherit; background: var(--paper-2); outline: none;
  }
  .form textarea { resize: vertical; min-height: 90px; }
  .form .btns { display: flex; gap: 10px; margin-top: 16px; }
  .form .btns .btn { flex: 1; padding: 10px; }
  .note { font-size: 12px; color: var(--ink-soft); line-height: 1.7; margin-top: 10px; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink); }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; line-height: 1.6;
    padding: 9px 16px; border-radius: 12px; z-index: 99; max-width: 86vw;
    border: 3px solid var(--accent);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }

  .ripple {
    position: absolute; border-radius: 50%; background: currentColor;
    opacity: .28; transform: scale(0); pointer-events: none;
    animation: rip .45s ease-out forwards;
  }
  @keyframes rip { to { transform: scale(2.4); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* ---- 桌面 / 宽屏适配：仅新增媒体查询，基础规则（移动端）保持原样 ---- */
  @media (min-width: 768px) {
    #app { max-width: 640px; }
    #toast { max-width: 480px; }
    .overlay { align-items: center; padding: 24px; }
    .sheet {
      max-width: 560px; max-height: 80vh;
      border-bottom: 3px solid var(--ink); border-radius: 20px;
      transform: translateY(12px);
    }
    #chat, #sceneBar, #stage, .sheet { scrollbar-width: thin; scrollbar-color: var(--ink-soft) transparent; }
    #chat::-webkit-scrollbar, .sheet::-webkit-scrollbar { width: 8px; }
    #sceneBar::-webkit-scrollbar, #stage::-webkit-scrollbar { width: 6px; height: 6px; }
    #chat::-webkit-scrollbar-track, #sceneBar::-webkit-scrollbar-track, #stage::-webkit-scrollbar-track, .sheet::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb, #sceneBar::-webkit-scrollbar-thumb, #stage::-webkit-scrollbar-thumb, .sheet::-webkit-scrollbar-thumb { background: var(--ink-soft); border-radius: 999px; }
    #chat::-webkit-scrollbar-thumb:hover, #sceneBar::-webkit-scrollbar-thumb:hover, #stage::-webkit-scrollbar-thumb:hover, .sheet::-webkit-scrollbar-thumb:hover { background: var(--ink); }
  }
  @media (min-width: 1024px) {
    #app { max-width: 860px; }
    #stage { height: 210px; }
    .standee { width: 116px; height: 170px; }
    .standee .nm { font-size: 12px; }
    .msg { max-width: 78%; }
    .msg.assistant { max-width: 84%; }
  }
  @media (hover: hover) and (pointer: fine) {
    header .tool:hover, .btn:hover, .chip:hover, #sendBtn:hover, #stopBtn:hover { transform: translateY(-1px); }
    header .tool:hover, .btn:hover, .chip:hover { box-shadow: 0 4px 0 var(--ink); }
    .btn.primary:hover { box-shadow: 0 4px 0 var(--primary-deep); }
    #sendBtn:hover { box-shadow: 0 5px 0 var(--primary-deep); }
    #stopBtn:hover { box-shadow: 0 5px 0 var(--danger-deep); }
    header .tool:hover:active, .btn:hover:active, .chip:hover:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .btn.primary:hover:active { box-shadow: 0 1px 0 var(--primary-deep); }
    #sendBtn:hover:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary-deep); }
    #stopBtn:hover:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--danger-deep); }
    .msg-actions button { transition: transform .1s, box-shadow .1s, color .15s; }
    .msg-actions button:hover { color: var(--ink); }
    #worldBtn { transition: transform .1s, box-shadow .1s, color .15s; }
    #worldBtn:hover { color: var(--primary); }
    .sheet .row .grow { transition: background .15s; }
    .sheet .row .grow:hover { background: rgba(51,37,63,.07); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="worldBtn" title="切换 / 管理世界观">…</button>
    <button class="tool" id="charBtn">角色</button>
    <button class="tool" id="settingsBtn">设置</button>
  </header>
  <div id="sceneBar"></div>
  <section id="stage" hidden></section>
  <main id="chat"></main>
  <footer id="inputBar">
    <select id="povSel" title="叙事视角"></select>
    <textarea id="promptInput" rows="1" placeholder="输入剧情指令或角色台词…"></textarea>
    <button id="sendBtn">发送</button>
    <button id="stopBtn" hidden>停止</button>
  </footer>
</div>

<!-- 世界观管理 / 切换 -->
<div class="overlay" id="worldOverlay" hidden>
  <div class="sheet">
    <h2>世界观</h2>
    <div id="worldList"></div>
    <button class="btn block" id="newWorldBtn">＋ 新建世界观</button>
    <div id="worldForm" class="form" hidden>
      <label>名称</label><input id="wfName" placeholder="世界观名称">
      <label>背景设定（时间、地点、规则、基调…）</label>
      <textarea id="wfSetting" placeholder="在这里描述这个世界…"></textarea>
      <div class="btns"><button class="btn" id="wfCancel">取消</button><button class="btn primary" id="wfSave">保存</button></div>
    </div>
    <button class="btn block" id="worldClose">关闭</button>
  </div>
</div>

<!-- 角色管理 -->
<div class="overlay" id="charOverlay" hidden>
  <div class="sheet">
    <h2>角色 <span style="font-size:12px;color:var(--ink-soft);font-weight:400">（勾选表示出场）</span></h2>
    <div id="charList"></div>
    <button class="btn block" id="newCharBtn">＋ 新建角色</button>
    <div id="charForm" class="form" hidden>
      <label>姓名</label><input id="cfName" placeholder="角色姓名">
      <label>立绘图片 URL（可留空，用占位符；本地文件可填 portraits/角色名.png）</label><input id="cfAvatar" placeholder="portraits/张极.png 或 https://…">
      <label>主题色（留空则按名字自动配色）</label><input id="cfColor" placeholder="#ff7a1a">
      <label>设定（外貌、性格、背景、与其他角色的关系…）</label>
      <textarea id="cfProfile" placeholder="在这里写 TA 的人设…"></textarea>
      <div class="btns"><button class="btn" id="cfCancel">取消</button><button class="btn primary" id="cfSave">保存</button></div>
    </div>
    <button class="btn block" id="charClose">关闭</button>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="settingsOverlay" hidden>
  <div class="sheet">
    <h2>设置</h2>
    <div class="form">
      <label>API Base（OpenAI 兼容，如 https://api.example.com/v1）</label>
      <input id="stBase" placeholder="https://…/v1">
      <label>API Key</label><input id="stKey" type="password" placeholder="sk-…">
      <label>模型名</label><input id="stModel" placeholder="如 gpt-4o-mini">
      <div class="btns"><button class="btn primary" id="stSave">保存</button></div>
    </div>
    <p class="note">⚠️ API Key 以明文保存在本浏览器 localStorage 中，仅会发往你配置的端点。共用设备请注意风险。端点需支持浏览器跨域（CORS）与流式（stream）输出。</p>
    <h2 style="margin-top:20px">数据备份</h2>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn" id="exportBtn" style="flex:1">导出 JSON</button>
      <button class="btn" id="importBtn" style="flex:1">导入 JSON</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <button class="btn block" id="settingsClose">关闭</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ================= 常量 ================= */
const LS_KEY = "cp-rp-store";
const GEN_PARAMS = { temperature: 0.9, top_p: 0.95, max_tokens: 2048 }; // D8 固定参数
const HISTORY_LIMIT = 20;
const STREAM_IDLE_TIMEOUT = 30000;

/* ================= 工具 ================= */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function $(sel) { return document.querySelector(sel); }
function charHue(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}
function hashColor(str) { return "hsl(" + charHue(str) + ",70%,55%)"; }
function charColor(c) { return c.color || hashColor(c.id); }
function hexToHsl(hex) {
  const m = /^#([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return null;
  const n = parseInt(m[1], 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2, d = max - min;
  if (!d) return [0, 0, Math.round(l * 100)];
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)];
}
const reduceMotionMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
function bindRipple() {
  document.addEventListener("pointerdown", function (e) {
    if (reduceMotionMQ.matches) return;
    const t = e.target.closest("button, .chip, .sheet .row .grow");
    if (!t || t.disabled) return;
    const rect = t.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const r = document.createElement("span");
    r.className = "ripple";
    r.style.width = r.style.height = size + "px";
    r.style.left = (e.clientX - rect.left - size / 2) + "px";
    r.style.top = (e.clientY - rect.top - size / 2) + "px";
    t.appendChild(r);
    setTimeout(function () { r.remove(); }, 500);
  });
}
let toastTimer = null;
function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= 数据层（design D2 / D5） ================= */
let store = null;
let streamState = null; // { abort, msgId }

function saveStore() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch (e) { toast("存储空间不足，建议在设置页导出备份后清理对话"); }

/* ================= HTML 消毒（design D7） ================= */
const SAFE_TAGS = new Set(["DIV","SPAN","P","B","I","EM","STRONG","U","S","BR","HR","IMG","BLOCKQUOTE","UL","OL","LI","H1","H2","H3","H4","TABLE","THEAD","TBODY","TR","TD","TH","CAPTION"]);
const DROP_TAGS = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","BASE","FORM","INPUT","BUTTON","TEXTAREA","SELECT","OPTION","VIDEO","AUDIO","SOURCE","SVG","MATH","FRAME","FRAMESET","NOSCRIPT","TEMPLATE"]);
function sanitizeStyle(css) {
  if (/url\s*\(|expression\s*\(|javascript:|vbscript:|@import|behavior\s*:|-moz-binding/i.test(css)) return "";
  return css;
}
function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(String(html), "text/html");
  function clean(node) {
    for (const child of Array.from(node.childNodes)) {
      if (child.nodeType === 8) { child.remove(); continue; }       // 注释
      if (child.nodeType !== 1) continue;                            // 文本放行
      const tag = child.tagName;
      if (DROP_TAGS.has(tag)) { child.remove(); continue; }          // 整体剔除
      if (!SAFE_TAGS.has(tag)) {                                     // 解包保留子内容
        while (child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        clean(node);
        return;
      }
      for (const attr of Array.from(child.attributes)) {             // 属性白名单
        const n = attr.name.toLowerCase();
        if (n === "style") {
          const s = sanitizeStyle(attr.value);
          if (s) child.setAttribute("style", s); else child.removeAttribute("style");
        } else if (tag === "IMG" && n === "src") {
          if (!/^(https:|data:image\/)/i.test(attr.value.trim())) child.removeAttribute("src");
        } else if (tag === "IMG" && n === "alt") {
          /* 保留 */
        } else {
          child.removeAttribute(attr.name);
        }
      }
      clean(child);
    }
  }
  clean(doc.body);
  return doc.body.innerHTML;
}
function looksLikeHtml(text) { return /<\/?[a-zA-Z][^>]*>/.test(text); }

function buildSystemPrompt(w, pov) {

  }

    "3. 当剧情出现合适的元素（如手机聊天界面、回忆片段、系统/旁白提示、信件、公告等）时，可以直接输出 HTML 片段来呈现。HTML 只允许使用 div/span/p/b/i/em/strong/u/s/br/hr/blockquote/ul/ol/li/h1-h4/table 等排版标签与内联 style，禁止 script、事件属性（如 onclick）与加载外部资源。除此之外的内容保持纯文本。",
    "4. 不要输出 Markdown 语法。",
    "5. 回复长度适中，聚焦当下剧情互动。"

}
function buildMessages(w, pov) {
  const history = w.messages
    .filter(m => (m.role === "user" || m.role === "assistant") && m.content && m.content.trim())
    .slice(-HISTORY_LIMIT)
    .map(m => ({ role: m.role, content: m.content }));
  return [{ role: "system", content: buildSystemPrompt(w, pov) }].concat(history);
}

/* ================= SSE 流式调用（design D6） ================= */
async function sseChat(opts) {
  const settings = store.settings;
  const url = settings.apiBase.replace(/\/+$/, "") + "/chat/completions";
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + settings.apiKey
    },
    body: JSON.stringify(Object.assign({ model: settings.model, messages: opts.messages, stream: true }, GEN_PARAMS)),
    signal: opts.signal
  });
  if (!res.ok) {
    let detail = "";
    try { detail = await res.text(); } catch (e) {}
    throw new Error("API 返回 " + res.status + (detail ? "：" + detail.slice(0, 200) : ""));
  }
  if (!res.body) throw new Error("响应不支持流式读取");
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    buf += decoder.decode(r.value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line || line.indexOf("data:") !== 0) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") return;
      try {
        const json = JSON.parse(data);
        const choice = json.choices && json.choices[0];
        const delta = choice && choice.delta && choice.delta.content;
        if (delta) opts.onDelta(delta);
      } catch (e) { /* 忽略无法解析的行 */ }
    }
  }
}

/* ================= 发送 / 生成流程 ================= */
function setStreaming(on) {
  $("#sendBtn").hidden = on;
  $("#stopBtn").hidden = !on;
  $("#promptInput").disabled = on;
  $("#povSel").disabled = on;
}
function currentPov() { return $("#povSel").value || "god"; }

async function generateReply(pov) {
  const w = curWorld();
  const aiMsg = { id: uid(), role: "assistant", content: "", pov: pov, ts: Date.now() };
  w.messages.push(aiMsg);
  renderMessages();
  const abort = new AbortController();
  streamState = { abort: abort, msgId: aiMsg.id };
  setStreaming(true);
  let idleTimer = setTimeout(() => abort.abort(), STREAM_IDLE_TIMEOUT);
  let failed = null, stopped = false;
  try {
    await sseChat({
      messages: buildMessages(w, pov),
      signal: abort.signal,
      onDelta: function (d) {
        aiMsg.content += d;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => abort.abort(), STREAM_IDLE_TIMEOUT);
        updateStreamingBubble(aiMsg);
      }
    });
  } catch (e) {
    if (abort.signal.aborted) { stopped = true; }
    else { failed = e; }
  }
  clearTimeout(idleTimer);
  if (failed) {
    w.messages = w.messages.filter(m => m.id !== aiMsg.id);
    toast("生成失败：" + failed.message + "（可能是网络、CORS 或端点不支持流式）");
  } else if (!aiMsg.content.trim()) {
    w.messages = w.messages.filter(m => m.id !== aiMsg.id);
    if (stopped) toast("已停止，未生成内容");
    else toast("未收到内容");
  } else if (stopped) {
    toast("已停止，保留已生成内容");
  }
  streamState = null;
  setStreaming(false);
  saveStore();
  renderMessages();
}

function send() {
  if (streamState) return;
  const input = $("#promptInput");
  const prompt = input.value.trim();
  if (!prompt) return;
  const s = store.settings;
  if (!s.apiBase || !s.apiKey || !s.model) {
    toast("请先在设置页完成 API 配置");
    openOverlay("settingsOverlay");
    return;
  }
  const w = curWorld();
  const pov = currentPov();
  w.messages.push({ id: uid(), role: "user", content: prompt, pov: pov, ts: Date.now() });
  saveStore();
  input.value = "";
  autoGrow(input);
  generateReply(pov);
}
function stopStream() { if (streamState) streamState.abort.abort(); }

function regenerateLast() {
  if (streamState) return;
  const w = curWorld();
  const last = w.messages[w.messages.length - 1];
  if (!last || last.role !== "assistant") return;
  const pov = last.pov || "god";
  w.messages.pop();
  saveStore();
  generateReply(pov);
}
function deleteMessage(id) {
  if (streamState) return;
  const w = curWorld();
  w.messages = w.messages.filter(m => m.id !== id);
  saveStore();
  renderMessages();
}
function clearChat() {
  if (streamState) return;
  if (!confirm("确定清空当前世界观的全部对话吗？其他世界观不受影响。")) return;
  curWorld().messages = [];
  saveStore();
  renderMessages();
}

  w.messages.forEach(function (m, i) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + m.role + (streamState && streamState.msgId === m.id ? " streaming" : "");
    wrap.dataset.mid = m.id;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = m.role === "user" ? "导演指令" : povLabel(w, m.pov);
    wrap.appendChild(meta);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (streamState && streamState.msgId === m.id) {
      bubble.textContent = m.content; // 流式阶段纯文本
    } else if (m.role === "assistant" && looksLikeHtml(m.content)) {
      bubble.innerHTML = sanitizeHtml(m.content); // 富渲染（消毒后）
    } else {
      bubble.textContent = m.content;
    }
    wrap.appendChild(bubble);

    const actions = document.createElement("div");
    actions.className = "msg-actions";
    const del = document.createElement("button");
    del.textContent = "删除";
    del.onclick = function () { deleteMessage(m.id); };
    actions.appendChild(del);
    if (m.role === "assistant" && i === w.messages.length - 1 && !streamState) {
      const regen = document.createElement("button");
      regen.textContent = "重新生成";
      regen.onclick = regenerateLast;
      actions.appendChild(regen);
    }
    wrap.appendChild(actions);
    chat.appendChild(wrap);
  });
  chat.scrollTop = chat.scrollHeight;
}

function updateStreamingBubble(m) {
  const el = document.querySelector('.msg[data-mid="' + m.id + '"] .bubble');
  if (el) {
    el.textContent = m.content;
    const chat = $("#chat");
    chat.scrollTop = chat.scrollHeight;
  }
}

/* ---- 舞台区（立绘占位） ---- */
function standeeEl(c) {
  const el = document.createElement("div");
  el.className = "standee";
  el.dataset.cid = c.id;
  el.style.background = charColor(c);
  if (c.avatar) {
    const img = document.createElement("img");
    img.src = c.avatar;
    img.alt = c.name;
    img.onerror = function () { img.remove(); };
    el.appendChild(img);
  }
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = c.name || "?";
  el.appendChild(nm);
  return el;
}
function updateStageFocus() {
  const pov = currentPov();
  Array.from($("#stage").children).forEach(function (el) {
    el.classList.toggle("focus", pov !== "god" && el.dataset.cid === pov);
  });
}
function renderStage() {
  const w = curWorld();
  const stage = $("#stage");
  const ids = w.scene.filter(function (id) { return charById(w, id); });
  if (!ids.length) {
    stage.innerHTML = "";
    stage.hidden = true;
    return;
  }
  stage.hidden = false;
  Array.from(stage.children).forEach(function (el) {
    if (ids.indexOf(el.dataset.cid) < 0 && !el.classList.contains("leaving")) {
      el.classList.add("leaving");
      setTimeout(function () { el.remove(); }, 250);
    }
  });
  ids.forEach(function (id) {
    const c = charById(w, id);
    let el = stage.querySelector('.standee[data-cid="' + id + '"]');
    if (!el) {
      el = standeeEl(c);
      el.classList.add("entering");
      setTimeout(function () { el.classList.remove("entering"); }, 300);
    } else {
      el.style.background = charColor(c);
      const nm = el.querySelector(".nm");
      if (nm) nm.textContent = c.name || "?";
      let img = el.querySelector("img");
      if (c.avatar) {
        if (!img) {
          img = document.createElement("img");
          img.onerror = function () { img.remove(); };
          el.insertBefore(img, nm);
        }
        if (img.getAttribute("src") !== c.avatar) img.src = c.avatar;
        img.alt = c.name;
      } else if (img) {
        img.remove();
      }
    }
    stage.appendChild(el);
  });
  updateStageFocus();
}
function applyPovTheme() {
  const pov = currentPov();
  const app = $("#app");
  if (pov === "god" || !charById(curWorld(), pov)) {
    app.style.removeProperty("--pov-stage-bg");
    app.style.removeProperty("--pov-chat-bg");
    app.style.removeProperty("--pov-accent");
  } else {
    const c = charById(curWorld(), pov);
    const hsl = c && c.color ? hexToHsl(c.color) : null;
    const h = hsl ? hsl[0] : charHue(pov);
    app.style.setProperty("--pov-stage-bg", "hsl(" + h + ",72%,72%)");
    app.style.setProperty("--pov-chat-bg", "hsl(" + h + ",85%,88%)");
    app.style.setProperty("--pov-accent", "hsl(" + h + ",85%,55%)");
  }
  updateStageFocus();
}

function renderAll() {
  renderHeader();
  renderSceneBar();
  renderPovSelect();
  renderMessages();
}

/* ================= 场景 / 世界观 / 角色操作 ================= */
function toggleScene(charId) {
  const w = curWorld();
  const i = w.scene.indexOf(charId);
  if (i >= 0) w.scene.splice(i, 1); else w.scene.push(charId);
  saveStore();
  renderSceneBar();
  renderPovSelect();
  renderCharList();
}

function openOverlay(id) {
  const o = $("#" + id);
  clearTimeout(o._hideTimer);
  o.hidden = false;
  void o.offsetWidth;
  o.classList.add("open");
}
function closeOverlay(id) {
  const o = $("#" + id);
  o.classList.remove("open");
  clearTimeout(o._hideTimer);
  o._hideTimer = setTimeout(function () { o.hidden = true; }, 250);
}

/* ---- 世界观管理 ---- */
let editingWorldId = null;
function renderWorldList() {
  const list = $("#worldList");
  list.innerHTML = "";
  Object.values(store.worlds).forEach(function (w) {
    const row = document.createElement("div");
    row.className = "row";
    const grow = document.createElement("div");
    grow.className = "grow";
    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = (w.id === store.currentWorldId ? "✓ " : "") + w.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = w.characters.length + " 个角色 · " + w.messages.length + " 条对话";
    grow.appendChild(nm); grow.appendChild(sub);
    grow.style.cursor = "pointer";
    grow.onclick = function () { switchWorld(w.id); };
    const edit = document.createElement("button");
    edit.className = "btn"; edit.textContent = "编辑";
    edit.onclick = function () { openWorldForm(w.id); };
    const del = document.createElement("button");
    del.className = "btn danger"; del.textContent = "删";
    del.onclick = function () { deleteWorld(w.id); };
    row.appendChild(grow); row.appendChild(edit); row.appendChild(del);
    list.appendChild(row);
  });
}
function openWorldForm(id) {
  editingWorldId = id || null;
  const w = id ? store.worlds[id] : null;
  $("#wfName").value = w ? w.name : "";
  $("#wfSetting").value = w ? w.setting : "";
  $("#worldForm").hidden = false;
}
function saveWorldForm() {
  const name = $("#wfName").value.trim();
  if (!name) { toast("请填写世界观名称"); return; }
  const setting = $("#wfSetting").value;
  if (editingWorldId) {
    const w = store.worlds[editingWorldId];
    w.name = name; w.setting = setting;
  } else {
    const w = { id: uid(), name: name, setting: setting, characters: [], scene: [], messages: [] };
    store.worlds[w.id] = w;
    store.currentWorldId = w.id;
  }
  saveStore();
  $("#worldForm").hidden = true;
  renderWorldList();
  renderAll();
}
function switchWorld(id) {
  if (streamState) { toast("生成中，稍后再切换"); return; }
  store.currentWorldId = id;
  saveStore();
  renderWorldList();
  renderAll();
  closeOverlay("worldOverlay");
}
function deleteWorld(id) {
  const w = store.worlds[id];
  if (!confirm("删除「" + w.name + "」将同时删除其所有角色与对话，确定吗？")) return;
  delete store.worlds[id];
  if (store.currentWorldId === id) {
    const rest = Object.keys(store.worlds);
    if (rest.length) {
      store.currentWorldId = rest[0];
    } else {
      const fresh = { id: uid(), name: "新世界观", setting: "", characters: [], scene: [], messages: [] };
      store.worlds[fresh.id] = fresh;
      store.currentWorldId = fresh.id;
    }
  }
  saveStore();
  renderWorldList();
  renderAll();
}

/* ---- 角色管理 ---- */
let editingCharId = null;
function renderCharList() {
  if ($("#charOverlay").hidden) return;
  const w = curWorld();
  const list = $("#charList");
  list.innerHTML = "";
  w.characters.forEach(function (c) {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(avatarEl(c, true));
    const grow = document.createElement("div");
    grow.className = "grow";
    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = c.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = (c.profile || "").slice(0, 40);
    grow.appendChild(nm); grow.appendChild(sub);
    grow.style.cursor = "pointer";
    grow.onclick = function () { openCharForm(c.id); };
    const sw = document.createElement("label");
    sw.className = "switch";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = w.scene.indexOf(c.id) >= 0;
    cb.onchange = function () { toggleScene(c.id); };
    sw.appendChild(cb);
    sw.appendChild(document.createTextNode("出场"));
    const edit = document.createElement("button");
    edit.className = "btn"; edit.textContent = "编辑";
    edit.onclick = function () { openCharForm(c.id); };
    const del = document.createElement("button");
    del.className = "btn danger"; del.textContent = "删";
    del.onclick = function () { deleteChar(c.id); };
    row.appendChild(grow); row.appendChild(sw); row.appendChild(edit); row.appendChild(del);
    list.appendChild(row);
  });
}
function openCharForm(id) {
  editingCharId = id || null;
  const c = id ? charById(curWorld(), id) : null;
  $("#cfName").value = c ? c.name : "";
  $("#cfAvatar").value = c ? (c.avatar || "") : "";
  $("#cfColor").value = c ? (c.color || "") : "";
  $("#cfProfile").value = c ? (c.profile || "") : "";
  $("#charForm").hidden = false;
}
function saveCharForm() {
  const name = $("#cfName").value.trim();
  if (!name) { toast("请填写角色姓名"); return; }
  let color = $("#cfColor").value.trim();
  if (color) {
    const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(color);
    if (!m) { toast("主题色格式应为 #rgb 或 #rrggbb，留空则自动配色"); return; }
    color = "#" + m[1].toLowerCase();
    if (color.length === 4) color = "#" + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
  }
  const w = curWorld();
  if (editingCharId) {
    const c = charById(w, editingCharId);
    c.name = name; c.avatar = $("#cfAvatar").value.trim(); c.color = color; c.profile = $("#cfProfile").value;
  } else {
    const c = { id: uid(), name: name, avatar: $("#cfAvatar").value.trim(), color: color, profile: $("#cfProfile").value };
    w.characters.push(c);
    w.scene.push(c.id);
  }
  saveStore();
  $("#charForm").hidden = true;
  renderCharList();
  renderSceneBar();
  renderPovSelect();
}
function deleteChar(id) {
  const w = curWorld();
  const c = charById(w, id);
  if (!confirm("删除角色「" + c.name + "」？历史对话会保留。")) return;
  w.characters = w.characters.filter(x => x.id !== id);
  w.scene = w.scene.filter(x => x !== id);
  saveStore();
  renderCharList();
  renderSceneBar();
  renderPovSelect();
}

/* ---- 设置 / 导入导出 ---- */
function openSettings() {
  $("#stBase").value = store.settings.apiBase || "";
  $("#stKey").value = store.settings.apiKey || "";
  $("#stModel").value = store.settings.model || "";
  openOverlay("settingsOverlay");
}
function saveSettings() {
  store.settings.apiBase = $("#stBase").value.trim();
  store.settings.apiKey = $("#stKey").value.trim();
  store.settings.model = $("#stModel").value.trim();
  saveStore();
  toast("设置已保存");
  closeOverlay("settingsOverlay");
}
function exportJson() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cp-rp-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJson(file) {
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object" || !data.worlds || typeof data.worlds !== "object" || !data.currentWorldId || !data.worlds[data.currentWorldId]) {
        throw new Error("文件结构不正确");
      }
      if (!confirm("导入将覆盖当前全部数据，确定吗？")) return;
      if (!data.settings) data.settings = { apiBase: "", apiKey: "", model: "" };
      store = data;
      saveStore();
      renderAll();
      toast("导入成功");
      closeOverlay("settingsOverlay");
    } catch (e) {
      toast("导入失败：" + e.message);
    }
  };
  reader.readAsText(file);
}

/* ================= 输入区 ================= */
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

/* ================= 事件绑定 ================= */
function bindEvents() {
  $("#sendBtn").onclick = send;
  $("#stopBtn").onclick = stopStream;
  $("#promptInput").addEventListener("input", function () { autoGrow(this); });
  $("#promptInput").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    if (!matchMedia("(pointer: fine)").matches) return;
    e.preventDefault();
    send();
  });
  $("#worldBtn").onclick = function () { $("#worldForm").hidden = true; renderWorldList(); openOverlay("worldOverlay"); };
  $("#charBtn").onclick = function () { $("#charForm").hidden = true; openOverlay("charOverlay"); renderCharList(); };
  $("#settingsBtn").onclick = openSettings;
  $("#newWorldBtn").onclick = function () { openWorldForm(null); };
  $("#wfSave").onclick = saveWorldForm;
  $("#wfCancel").onclick = function () { $("#worldForm").hidden = true; };
  $("#worldClose").onclick = function () { closeOverlay("worldOverlay"); };
  $("#newCharBtn").onclick = function () { openCharForm(null); };
  $("#cfSave").onclick = saveCharForm;
  $("#cfCancel").onclick = function () { $("#charForm").hidden = true; };
  $("#charClose").onclick = function () { closeOverlay("charOverlay"); };
  $("#stSave").onclick = saveSettings;
  $("#settingsClose").onclick = function () { closeOverlay("settingsOverlay"); };
  $("#exportBtn").onclick = exportJson;
  $("#importBtn").onclick = function () { $("#importFile").click(); };
  $("#importFile").onchange = function () { if (this.files[0]) importJson(this.files[0]); this.value = ""; };
  $("#povSel").onchange = applyPovTheme;
  bindRipple();
}

/* ================= 启动 ================= */
ensureStore();
bindEvents();
renderAll();
</script>
</body>
</html>
